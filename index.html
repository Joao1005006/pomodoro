<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Standoff 2 — Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="sf-root">

  <div class="sf-header">
    <div class="sf-logo">
      <div class="sf-logo-icon">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="7" stroke="#fff" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="2.5" fill="#fff"/>
          <line x1="9" y1="1"    x2="9"   y2="4.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="9" y1="13.5" x2="9"   y2="17"  stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="1" y1="9"    x2="4.5" y2="9"   stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.5" y1="9" x2="17"  y2="9"   stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="sf-logo-text">Standoff Timer</div>
        <div class="sf-logo-sub">POMODORO OPS</div>
      </div>
    </div>
    <div class="sf-season">
      <div class="sf-season-label">TEMPORADA</div>
      <div class="sf-season-val">S-25</div>
    </div>
  </div>

  <div class="sf-body">

    <div class="sf-mode-tabs">
      <button class="sf-tab active" id="tab-focus" onclick="setMode('focus')">Missão (25m)</button>
      <button class="sf-tab"        id="tab-short" onclick="setMode('short')">Recuo (5m)</button>
      <button class="sf-tab"        id="tab-long"  onclick="setMode('long')">Base (15m)</button>
    </div>

    <div class="sf-arena">
      <svg class="sf-crosshair" viewBox="0 0 200 200" fill="none">
        <circle cx="100" cy="100" r="90" stroke="#c0392b" stroke-width="1"/>
        <circle cx="100" cy="100" r="60" stroke="#c0392b" stroke-width="0.5"/>
        <circle cx="100" cy="100" r="5"  stroke="#c0392b" stroke-width="1.5"/>
        <line x1="100" y1="10"  x2="100" y2="80"  stroke="#c0392b" stroke-width="1"/>
        <line x1="100" y1="120" x2="100" y2="190" stroke="#c0392b" stroke-width="1"/>
        <line x1="10"  y1="100" x2="80"  y2="100" stroke="#c0392b" stroke-width="1"/>
        <line x1="120" y1="100" x2="190" y2="100" stroke="#c0392b" stroke-width="1"/>
      </svg>

      <div class="sf-ring-wrap">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="78" fill="none" stroke="#2a2a3e" stroke-width="8"/>
          <circle id="sf-ring" cx="90" cy="90" r="78" fill="none"
            stroke="#c0392b" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="490" stroke-dashoffset="0"/>
        </svg>
        <div class="sf-ring-center">
          <div id="sf-time" class="sf-time">25:00</div>
          <div id="sf-mode-name" class="sf-mode-name">MISSÃO ATIVA</div>
        </div>
      </div>

      <div class="sf-status">
        <div class="sf-dot" id="sf-dot"></div>
        <div class="sf-status-text" id="sf-status-text">Aguardando início</div>
      </div>

      <div class="sf-controls">
        <button class="sf-btn-icon" onclick="resetTimer()" title="Resetar">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M3 9a6 6 0 1 0 1.5-4"/>
            <polyline points="1 5 3 9 7 7"/>
          </svg>
        </button>
        <button class="sf-btn-main" id="sf-btn-start" onclick="toggleTimer()">Iniciar</button>
        <button class="sf-btn-icon" onclick="skipSession()" title="Pular">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="4 3 14 9 4 15"/>
            <line x1="15" y1="3" x2="15" y2="15"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="sf-stats">
      <div class="sf-stat">
        <div id="stat-kills"  class="sf-stat-val red">0</div>
        <div class="sf-stat-label">MISSÕES</div>
      </div>
      <div class="sf-stat">
        <div id="stat-min"    class="sf-stat-val">0</div>
        <div class="sf-stat-label">MINUTOS</div>
      </div>
      <div class="sf-stat">
        <div id="stat-cycles" class="sf-stat-val">0</div>
        <div class="sf-stat-label">CICLOS</div>
      </div>
      <div class="sf-stat">
        <div id="stat-streak" class="sf-stat-val amber">0</div>
        <div class="sf-stat-label">SEQUÊNCIA</div>
      </div>
    </div>

    <div class="sf-log-title">REGISTRO DE OPERAÇÕES</div>
    <div class="sf-log" id="sf-log">
      <div class="sf-log-empty" id="sf-log-empty">Nenhuma operação registrada</div>
    </div>

    <div class="sf-toast" id="sf-toast"></div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
